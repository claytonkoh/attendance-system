version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: attendance_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        # For local testing, this points to localhost. 
        # For production, change this to your domain/IP.
        VITE_API_URL: http://localhost:8000
    container_name: attendance_frontend
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - backend
